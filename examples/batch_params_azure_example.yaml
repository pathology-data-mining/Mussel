# Example: parameters configuration with Azure Batch-specific settings
# Use this file with --config when specifying --csv-manifest

# General processing parameters
prefilter_model_type: CTRANSPATH
batch_size: 64
num_workers: 4
patch_size: 256
mpp: 0.5
use_gpu: true
segment_threshold: 0
classifier_threshold: 0.75

# Aggregation settings
aggregation_method: identity

# Retry configuration
max_retry_count: 3

# Standardized resource requirements (works across all backends)
resources:
  cpus: 8
  memory: 32G
  gpus: 1

# AWS S3 configuration (optional, for S3-compatible storage)
aws:
  region: us-east-1
  endpoint_url: https://s3.example.com  # Optional: for S3-compatible storage like MinIO

# Azure Batch-specific parameters (optional, for Azure Batch-only settings)
azure:
  # Azure Batch account configuration
  # Note: For security, credentials (batch_account_key, storage_account_key) should be 
  # provided via environment variables or command-line, not in the config file
  batch_account_name: "mybatchaccount"  # Or set AZURE_BATCH_ACCOUNT_NAME env var
  batch_account_url: "https://mybatchaccount.eastus.batch.azure.com"  # Or set AZURE_BATCH_ACCOUNT_URL env var
  # batch_account_key: "..."  # Use AZURE_BATCH_ACCOUNT_KEY env var instead
  
  # Pool and job identifiers (optional, will be auto-generated if not specified)
  pool_id: "mussel-pool"  # Pool ID for batch processing
  job_id: "mussel-job-001"  # Job ID for this batch run
  
  # Pool lifecycle flags
  create_pool: true  # Automatically create pool if it doesn't exist
  create_job: true  # Automatically create job
  
  # Docker container image to use for batch processing
  container_image: "mskmind/mussel:latest-torch-gpu"
  
  # Azure Storage account for staging files (optional)
  storage_account_name: "mystorageaccount"  # Or set AZURE_STORAGE_ACCOUNT_NAME env var
  # storage_account_key: "..."  # Use AZURE_STORAGE_ACCOUNT_KEY env var instead
  
  # Azure Files configuration (optional)
  azure_files_share_name: "mussel-staging"  # Azure Files share for staging
  mount_azure_files: true  # Mount Azure Files to pool nodes
  
  # Pool configuration (optional, can also be specified via command-line)
  vm_size: "Standard_NC6s_v3"  # VM size for pool nodes
  node_count: 2  # Number of nodes in the pool
  
  # VM image configuration (optional, uses defaults for Azure Batch container support)
  # These advanced options allow customization of the VM image used for the pool
  # publisher: "microsoft-azure-batch"  # Azure VM image publisher
  # offer: "ubuntu-server-container"    # Azure VM image offer
  # sku: "20-04-lts"                    # Azure VM image SKU
  # vm_type: "batch.node.ubuntu 20.04"  # Node agent SKU ID
  
  # Auto-scaling configuration (optional)
  # enable_auto_scale: true
  # min_node_count: 1
  # max_node_count: 10
  # auto_scale_evaluation_interval: 15  # minutes

# Note: Sensitive credentials should be provided via environment variables:
# - AZURE_BATCH_ACCOUNT_KEY
# - AZURE_STORAGE_ACCOUNT_KEY
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - HF_TOKEN
