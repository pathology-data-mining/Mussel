[tool.poetry]
name = "mussel"
version = "0.1.0"
description = "weakly supervised computational pathology on whole slide images"
authors = ["Your Name <you@example.com>"]
license = "GPL-3.0 license"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.1"
numpy = "^1.26.4"
opencv-python = "^4.9.0.80"
h5py = "^3.10.0"
matplotlib = "^3.8.3"
openslide-python = "^1.3.1"
torch = "^2.2.1"
torchvision = "^0.17.1"
hydra-core = "^1.3.2"
snakemake = "^8.8.0"
dacite = "^1.8.1"
open-clip-torch = "^2.24.0"
transformers = "^4.38.2"
htcondor = "^23.5.2"
snakemake-executor-plugin-cluster-generic = "^1.0.9"
sentencepiece = "^0.2.0"
loguru = "^0.7.2"


[tool.poetry.group.dev.dependencies]
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
annotate = 'mussel.cli.annotate:main'
cache_tiles = 'mussel.cli.cache_tiles:main'
extract_features = 'mussel.cli.extract_features:main'
tessellate = 'mussel.cli.tessellate:main'
