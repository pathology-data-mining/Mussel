[project]
name = "mussel"
version = "1.1.1"
description = "weakly supervised computational pathology on whole slide images"
license = { text = "GPL-3.0 license" }
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
  "pandas",
  "numpy<2.3",
  "h5py",
  "matplotlib",
  "tiffslide",
  "opencv-python-headless",
  "hydra-core",
  "loguru",
  "geopandas",
  "scikit-learn",
  "transformers",
  "transpath@git+https://github.com/msk-mind/TransPath/",
  "timm_ctranspath@git+https://github.com/msk-mind/timm-ctranspath",
  "shapely>=2.0.7",
  "einops>=0.8.1",
  "einops-exts>=0.0.4",
]

[dependency-groups]
dev = ["mypy", "isort", "black", "pytest", "ipython>=8.37.0"]

[project.optional-dependencies]
"tensorflow-gpu" = [
  "tensorflow[and-cuda]<=2.19.0",
  "keras",
  "tf-keras",
  "huggingface_hub<0.20",
  "torch < 2.6",
  "torchvision",
  "open-clip-torch",
]
"tensorflow-cpu" = [
  "tensorflow",
  "keras",
  "tf-keras",
  "torch < 2.6",
  "torchvision",
  "open-clip-torch",
]
"torch-cpu" = ["torch < 2.6", "torchvision", "open-clip-torch"]
"torch-gpu" = ["torch < 2.6", "torchvision", "open-clip-torch"]

[tool.uv]
conflicts = [
  [
    { extra = "tensorflow-gpu" },
    { extra = "tensorflow-cpu" },
    { extra = "torch-cpu" },
    { extra = "torch-gpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "torch-cpu", extra = "tensorflow-gpu" },
  { index = "torch-cpu", extra = "tensorflow-cpu" },
  { index = "torch-cpu", extra = "torch-cpu" },
  { index = "torch-gpu", extra = "torch-gpu" },
]
torchvision = [
  { index = "torch-cpu", extra = "tensorflow-gpu" },
  { index = "torch-cpu", extra = "tensorflow-cpu" },
  { index = "torch-cpu", extra = "torch-cpu" },
  { index = "torch-gpu", extra = "torch-gpu" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools.packages.find]
include = ["mussel*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
annotate = 'mussel.cli.annotate:main'
cache_tiles = 'mussel.cli.cache_tiles:main'
extract_features = 'mussel.cli.extract_features:main'
filter_features = 'mussel.cli.filter_features:main'
tessellate = 'mussel.cli.tessellate:main'
create_class_embeddings = 'mussel.cli.create_class_embeddings:main'
merge_annotation_features = 'mussel.cli.merge_annotation_features:main'
linear_probe_benchmark = 'mussel.cli.linear_probe_benchmark:main'
export_tiles = 'mussel.cli.export_tiles:main'
save_model = 'mussel.cli.save_model:main'
