[project]
name = "mussel"
version = "1.1.1"
description = "weakly supervised computational pathology on whole slide images"
license = { text = "GPL-3.0 license" }
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
  "pandas",
  "numpy<2.3",
  "h5py",
  "matplotlib",
  "tiffslide",
  "opencv-python-headless",
  "hydra-core",
  "loguru",
  "geopandas",
  "scikit-learn",
  "transformers",
  "transpath@git+https://github.com/msk-mind/TransPath/",
  "timm_ctranspath@git+https://github.com/msk-mind/timm-ctranspath",
  "shapely>=2.0.7",
  "einops>=0.8.1",
  "einops-exts>=0.0.4",
]

[dependency-groups]
dev = ["mypy", "isort", "black", "pytest", "ipython>=8.37.0"]

[project.optional-dependencies]
"tensorflow-gpu" = [
  "tensorflow[and-cuda]<=2.19.0",
  "keras",
  "tf-keras",
  "huggingface_hub>=0.20,<0.21",
  "torch < 2.6",
  "torchvision",
  "open-clip-torch",
]
"tensorflow-cpu" = [
  "tensorflow",
  "keras",
  "tf-keras",
  "torch < 2.6",
  "torchvision",
  "open-clip-torch",
]
"torch-cpu" = ["torch < 2.6", "torchvision", "open-clip-torch"]
"torch-gpu" = ["torch < 2.6", "torchvision", "open-clip-torch"]
"gigapath" = [
  "gigapath@git+https://github.com/prov-gigapath/prov-gigapath",
  "torch < 2.6",
  "torchvision",
  "xformers==0.0.18",
  "huggingface-hub>=0.20,<0.21",
  "transformers==4.36.2",
  "flash-attn==2.5.8",
  "timm>=1.0.3",
  "omegaconf",
  "torchmetrics==0.10.3",
  "fvcore",
  "iopath",
  "webdataset",
  "lifelines",
  "scikit-survival",
  "fairscale",
  "wandb",
  "packaging==23.2",
  "ninja==1.11.1.1",
]

[tool.uv]
conflicts = [
  [
    { extra = "tensorflow-gpu" },
    { extra = "tensorflow-cpu" },
    { extra = "torch-cpu" },
    { extra = "torch-gpu" },
    { extra = "gigapath" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "torch-cpu", extra = "tensorflow-gpu" },
  { index = "torch-cpu", extra = "tensorflow-cpu" },
  { index = "torch-cpu", extra = "torch-cpu" },
  { index = "torch-gpu", extra = "torch-gpu" },
  { index = "torch-gpu-cu118", extra = "gigapath" },
]
torchvision = [
  { index = "torch-cpu", extra = "tensorflow-gpu" },
  { index = "torch-cpu", extra = "tensorflow-cpu" },
  { index = "torch-cpu", extra = "torch-cpu" },
  { index = "torch-gpu", extra = "torch-gpu" },
  { index = "torch-gpu-cu118", extra = "gigapath" },
]
flash-attn = [
  { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.5.8/flash_attn-2.5.8+cu118torch2.0cxx11abiFALSE-cp310-cp310-linux_x86_64.whl", marker = "python_version == '3.10'" },
  { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.5.8/flash_attn-2.5.8+cu118torch2.0cxx11abiFALSE-cp311-cp311-linux_x86_64.whl", marker = "python_version == '3.11'" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "torch-gpu-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.setuptools.packages.find]
include = ["mussel*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
annotate = 'mussel.cli.annotate:main'
cache_tiles = 'mussel.cli.cache_tiles:main'
extract_features = 'mussel.cli.extract_features:main'
aggregate_slide_features = 'mussel.cli.aggregate_slide_features:main'
filter_features = 'mussel.cli.filter_features:main'
filter_tessellate = 'mussel.cli.filter_tessellate:main'
tessellate = 'mussel.cli.tessellate:main'
tessellate_extract_features = 'mussel.cli.tessellate_extract_features:main'
create_class_embeddings = 'mussel.cli.create_class_embeddings:main'
merge_annotation_features = 'mussel.cli.merge_annotation_features:main'
linear_probe_benchmark = 'mussel.cli.linear_probe_benchmark:main'
export_tiles = 'mussel.cli.export_tiles:main'
save_model = 'mussel.cli.save_model:main'
