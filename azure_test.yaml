# Azure Batch Configuration Example
# ==================================
# Use this file with: --config-file azure_test.yaml --csv-manifest slides.csv
#
# Output Location (specify with output_prefix):
# - Azure Blob: https://account.blob.core.windows.net/container/results/
# - S3: s3://bucket/results/
# - Azure Files: azfiles://account/share/outputs/
# - Local path: /path/to/output
#
# Results are automatically uploaded to the specified location after processing.

classifier_pkl: null
classifier_threshold: 0.75
slide_batch_size: 8
intermediate_h5_path: null

# General processing parameters
# Models will be automatically downloaded from HuggingFace
# Skip prefilter to avoid Azure Files dependency (use only model)
prefilter_model_type: CTRANSPATH
model_type: OPTIMUS
prefilter_model_path: /gpfs/mskmind_ess/limr/repos/TransPath/ctranspath.pth
classifier_pkl: /gpfs/mskmind_ess/limr/repos/Mussel/model-1727990346535.pkl
batch_size: 128
num_workers: 8
use_gpu: true
# seg_config group removed to avoid preset defaults
seg_config:
  group: biopsy

# Aggregation settings
aggregation_method: identity

# Retry configuration
max_retry_count: 3

# Standardized resource requirements (works across all backends)
resources:
  cpus: 8
  memory: 32G
  gpus: 1

# AWS S3 configuration (optional, for S3-compatible storage)
aws:
  endpoint_url: http://pmindecs.mskcc.org:9020

# SLURM-specific parameters (optional, for SLURM-only settings)
slurm:
  time: "04:00:00"

azure:
  batch_account_name: "ocra"
  batch_account_url: "https://ocra.eastus2.batch.azure.com"
  container_image: "mskmind/mussel:v2"
  storage_account_name: "mskpdmgen2"
  # Enable staging to Azure Blob for local slide paths (will download to container local temp)
  stage_to_azure_blob: true
  azure_blob_container: "mussel-slides"
  stage_to_azure_files: false
  mount_azure_files: false
  cleanup_staged_files: true
  # Output location: Use S3 for simplicity
  output_prefix: "s3://mussel-test/outputs/"
  pool_id: "mussel-unified-test-pool"
  job_id: "mussel-unified-test-job"
  create_pool: true
  create_job: true
  vm_size: "Standard_NC24ads_A100_v4"
  max_node_count: 2
  min_node_count: 0
  enable_auto_scale: true
  publisher: "microsoft-dsvm"
  offer: "ubuntu-hpc"
  sku: "2204"
  node_agent_sku_id: "batch.node.ubuntu 22.04"
  # Container registry settings (optional, for ACR pre-pull)
  # If using Azure Container Registry, uncomment and configure:
  # container_registry_server: "myregistry.azurecr.io"
  # container_registry_username: "myregistry"
  # container_registry_password: "..."  # Or use AZURE_CONTAINER_REGISTRY_PASSWORD env var
  # Container prepull is now always enabled (no need to specify)
  # use_container_prepull is always true


# Note: Sensitive fields like AWS credentials should be provided via command-line
# not in the config file for security
