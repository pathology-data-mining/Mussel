# Example: parameters configuration with SLURM-specific settings
# Use this file with --config when specifying --csv-manifest

# General processing parameters
prefilter_model_type: CTRANSPATH
prefilter_model_path: /gpfs/mskmind_ess/limr/repos/TransPath/ctranspath.pth
postfilter_model_type: OPTIMUS
classifier_pkl: /gpfs/mskmind_ess/limr/repos/Mussel/model-1727990346535.pkl
classifier_threshold: 0.75
batch_size: 64
num_workers: 8
use_gpu: true
classifier_threshold: 0.75
seg_config:
  group: biopsy

# Aggregation settings
aggregation_method: identity

# Retry configuration
max_retry_count: 3

# Standardized resource requirements (works across all backends)
resources:
  cpus: 8
  memory: 32G
  gpus: 1

# AWS S3 configuration (optional, for S3-compatible storage)
aws:
  endpoint_url: http://pmindecs.mskcc.org:9020

# SLURM-specific parameters (optional, for SLURM-only settings)
slurm:
  time: "04:00:00"

azure:
  batch_account_name: "ocra"
  batch_account_url: "https://ocra.eastus2.batch.azure.com"
  container_image: "mskmind/mussel:latest"
  storage_account_name: "mskpdmgen2"
  azure_files_share_name: "mussel-staging"
  stage_to_azure_files: true
  mount_azure_files: true
  cleanup_staged_files: true
  output_dir_azfiles: "azfiles://mskpdmgen2/mussel-staging/outputs"
  pool_id: "mussel-pool"
  job_id: "mussel-test-job-$(date +%Y%m%d-%H%M%S)"
  create_pool: true
  create_job: true
  vm_size: "Standard_NC24ads_A100_v4"
  max_node_count: 100
  min_node_count: 5
  enable_auto_scale: true


# Note: Sensitive fields like AWS credentials should be provided via command-line
# not in the config file for security
