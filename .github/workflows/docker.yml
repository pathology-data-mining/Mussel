name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: mskmind/mussel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - torch-gpu
          - torch-cpu
          - tensorflow-gpu
          - tensorflow-cpu
          - fastattn

    steps:
    - name: Free disk space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch,suffix=-${{ matrix.backend }}
          type=semver,pattern={{version}},suffix=-${{ matrix.backend }}
          type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.backend }}
          type=raw,value=latest,suffix=-${{ matrix.backend }},enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BACKEND=${{ matrix.backend }}
        cache-from: type=gha,scope=${{ matrix.backend }}
        cache-to: type=gha,mode=min,scope=${{ matrix.backend }},ignore-error=true

    - name: Update Docker Hub description
      if: matrix.backend == 'torch-gpu'
      continue-on-error: true
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ env.IMAGE_NAME }}
        short-description: "Mussel - Computational pathology toolkit for whole-slide images"
        readme-filepath: ./README.md
