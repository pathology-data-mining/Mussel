$schema: https://json-schema.org/draft/2020-12/schema
description: parameters schema
properties:
    patch_size:
        type: integer
        default: 256
        description: patch size
    step_size:
        type: integer
        default: 256
        description: step size
    mpp:
        type: number
        default: 0.5
        description: microns per pixel
    tissue_area_threshold:
        type: integer
        default: 100
        description: contour filtering tissue area threshold
    model:
        description: feature extraction model
        default: quiltnet
        enum:
          - resnet50
          - ctranspath
          - quiltnet
          - openclip
