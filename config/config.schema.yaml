$schema: "https://json-schema.org/draft/2020-12/schema"
description: Mussel snakemake configuration
properties:
  reef_dir:
    type: string
    default: "reef"
    description: reef directory to store tessellation outputs and extracted features
  output_dir:
    type: string
    default: "results"
    description: output directory
  slide_list_path:
    type: string
    default: slides.txt
    description: list of slide IDs
  parameters_csv_path:
    type: string
    description: parameter space csv, columns must conform to
      parameters.schema.yaml, rows are parameter values
  batch_size:
    type: integer
    default: 8
    description: batch size
  transpath_dir:
    type: string
    description: CTransPath dir (https://github.com/Xiyue-Wang/TransPath)
  transpath_model_path:
    type: string
    description: CTranspath model (.pth file)
  use_gpu:
    type: boolean
    default: true
    description: Use GPU
  gpu_device_ids:
    type: array
    description: GPU device IDs as integers
    items:
      type: integer
  all_slides:
    type: boolean
    default: false
    description: run all slides in slide manifest
  test:
    type: boolean
    default: false
    description: test mode
  quiltnet_model_path:
    type: string
    description: Path to quiltnet model
    default: "hf-hub:wisdomik/QuiltNet-B-16-PMB"
  annotation_class_csv:
    type: string
    description: annotation class csv
  annotation_class_json_path:
    type: string
    description: Path to annotation class json
  annotation_class_to_cache_json_path:
    type: string
    description: Path to annotation classes to cache json
  default_annotation_classes:
    type: array
    description: annotation classes to use if not explicitly defined
    items:
      type: string
    default:
      - carcinoma in situ
      - invasive carcinoma
      - collagenous stroma
      - adipose
      - vessel
      - necrosis
      - invasive adenocarcinoma
      - sarcoma
  default_annotation_classes_to_cache:
    type: array
    description: limit caching to these classes
    default:
      - invasive carcinoma
      - invasive adenocarcinoma
      - sarcoma
    items:
      type: string
  dremio:
    type: object
    properties:
      scheme:
        type: string
        default: "grpc+tcp"
      hostname:
        type: string
      port:
        type: integer
        default: 32010
      space:
        type: string
        default: '"pathology-data-mining".mussel'
      table:
        type: string
        default: "slide_directory"
